[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wheel-sentinel"
version = "0.1.0"
description = "Bounded read-only Python wheel path and RECORD hash verifier."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Nripanka Das"}]
dependencies = []

[project.scripts]
wheel-sentinel = "wheel_sentinel:main"

[tool.setuptools]
py-modules = ["wheel_sentinel"]
